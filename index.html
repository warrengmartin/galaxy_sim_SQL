<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/galaxie2.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/main.js"></script>
  <title>Galaxy Simulation</title>
</head>
<body>
<div id="app"></div>
<div class="main-container" id="main-container">
  <video autoplay muted loop id="fontVideo">
    <source src="/public/font.mp4" type="video/mp4">
  </video>
  <div class="calque">
    <div class="container-buttons">
      <div class="button-container">
        <button class="button" id="choice1">Normal mode<br><span class="small">(Small configuration)</span></button>
        <button class="button" id="choice2">Experimental mode<br><span class="small">(GC GTX 1070 or higher recommended)</span></button>
        <button class="button" id="headlessBtn">Run Headless<br><span class="small">(Batch, no graphics)</span></button>
        <button class="button" id="replayBtn">Replay Mode<br><span class="small">(First 1000 frames)</span></button>
        <button class="button" id="sqlViewBtn">SQL Database View<br><span class="small">(Query and analyze data)</span></button>
      </div>
        <a href="https://github.com/N0rvel/galaxy_sim" target="_blank" >
          <div class="button-svg">
            <svg id="github_svg" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            <span>Github Repository</span>
          </div>
        </a>
    </div>
  </div>
</div>

<!-- Headless simulation overlay -->
<div id="headless-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;">
  <form id="headless-form" style="background:#222;padding:2em 3em;border-radius:1em;display:flex;flex-direction:column;gap:1em;color:#fff;">
    <h2>Headless Simulation</h2>
    <label>Frames per second: <input id="headless-fps" type="number" min="1" max="1000" value="110" /></label>
    <label>Duration (minutes): <input id="headless-mins" type="number" min="1" max="120" value="5" /></label>
    <label><input id="clear-db" type="checkbox" /> Overwrite database (delete all previous data)</label>
    <button type="submit" class="button">Start Headless</button>
  </form>
</div>

<!-- Headless progress indicator -->
<div id="headless-progress-div" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:10000;">
  <div style="background:#222;padding:2em 3em;border-radius:1em;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1em;">
    <h2>Particles initialized!</h2>
    <p id="headless-info-text">Ready to run headless simulation.</p>
    <button id="start-headless-btn" class="button" style="font-size:1.2em;padding:0.5em 2em;">Start Simulation</button>
    <button id="cancel-headless-btn" class="button" style="font-size:1em;padding:0.3em 1.5em;background:#444;">Cancel</button>
    <div id="headless-progress-bar" style="width:300px;height:20px;background:#444;border-radius:10px;overflow:hidden;margin-top:1em;display:none;">
      <div id="headless-progress-fill" style="height:100%;width:0%;background:#4caf50;"></div>
    </div>
    <div id="headless-progress-text" style="margin-top:0.5em;display:none;"></div>
  </div>
</div>

<!-- Loading message overlay -->
<div id="loading-message" style="position:fixed;top:50%;left:50%;transform:translate(-50%, -50%);background:rgba(0,0,0,0.8);color:#fff;padding:2em 3em;font-size:2em;border-radius:1em;z-index:9999;display:none;"></div>

<!-- Start simulation button -->
<button id="start-simulation-button" class="button" style="position:fixed;top:60%;left:50%;transform:translate(-50%, -50%);font-size:1.5em;padding:0.5em 2em;z-index:10000;display:none;">Start Simulation</button>
</body>
</html>
