# TimescaleDB tuning configuration for Galaxy Simulation
# Copy these settings to your postgresql.conf file or include this file

#------------------------------------------------------------------------------
# MEMORY SETTINGS
#------------------------------------------------------------------------------

# Shared buffers control how much memory PostgreSQL dedicates to caching data
# Recommended: 25% of system RAM (adjust based on your system)
shared_buffers = 4GB

# Work memory for complex operations like sorts and hash joins
# Increase this for better query performance
work_mem = 128MB

# Memory for maintenance operations like VACUUM, CREATE INDEX
maintenance_work_mem = 1GB

# Helps optimize query planning
effective_cache_size = 12GB

#------------------------------------------------------------------------------
# WRITE OPTIMIZATION
#------------------------------------------------------------------------------

# Write-ahead log settings for better write performance
wal_buffers = 16MB

# Checkpoint settings - less frequent checkpoints reduce I/O load
# but increase recovery time after a crash
checkpoint_timeout = 30min
max_wal_size = 16GB
checkpoint_completion_target = 0.9

# Background writer settings
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 1000

#------------------------------------------------------------------------------
# TIMESCALEDB SPECIFIC
#------------------------------------------------------------------------------

# Control number of background workers for compression and other tasks
timescaledb.max_background_workers = 8

# Optimize chunk memory for better insert performance
# These are TimescaleDB specific settings
timescaledb.max_insert_batch_size = 10000
timescaledb.telemetry_level = 'off'  # Disable telemetry if preferred

#------------------------------------------------------------------------------
# QUERY OPTIMIZATION
#------------------------------------------------------------------------------

# Planner settings
random_page_cost = 1.1  # Assuming data is on SSD
effective_io_concurrency = 200  # Higher for SSDs

# Parallel query execution
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
parallel_leader_participation = on

#------------------------------------------------------------------------------
# AUTO-VACUUM SETTINGS
#------------------------------------------------------------------------------

# Adjust autovacuum settings for large tables
autovacuum_vacuum_threshold = 1000
autovacuum_analyze_threshold = 1000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_limit = 2000

#------------------------------------------------------------------------------
# CONNECTION SETTINGS
#------------------------------------------------------------------------------

# Increase max connections for high concurrency
max_connections = 100

# Connection timeouts
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

#------------------------------------------------------------------------------
# LOGGING SETTINGS
#------------------------------------------------------------------------------

# Set appropriate logging for monitoring
log_min_duration_statement = 1000  # Log queries taking more than 1 second
log_checkpoints = on
log_autovacuum_min_duration = 1000  # Log autovacuum taking more than 1 second
