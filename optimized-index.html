<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/galaxie2.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Optimized Galaxy Simulation -->
  <script type="module" src="/optimized-galaxy-demo.js"></script>
  <title>Optimized Galaxy Simulation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    
    canvas {
      display: block;
    }
    
    /* Performance overlay styles */
    #stats-container {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      z-index: 1000;
      min-width: 200px;
    }
    
    #debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: #ffff00;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ffff00;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      max-width: 350px;
      z-index: 1000;
      display: none;
    }
    
    #control-panel {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ffff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #00ffff;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 1000;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #000011, #000033);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      color: white;
      font-family: 'Courier New', monospace;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #333;
      border-top: 3px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      text-align: center;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .loading-subtext {
      text-align: center;
      font-size: 12px;
      color: #888;
      max-width: 400px;
      line-height: 1.4;
    }
    
    /* Mode selection overlay */
    #mode-selection {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: 'Courier New', monospace;
    }
    
    .mode-container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      border: 2px solid #00ffff;
      border-radius: 10px;
      background: rgba(0, 20, 40, 0.8);
    }
    
    .mode-title {
      font-size: 28px;
      margin-bottom: 30px;
      color: #00ffff;
    }
    
    .mode-button {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 15px 20px;
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    
    .mode-button:hover {
      background: #00ff00;
      color: #000;
    }
    
    .mode-description {
      font-size: 12px;
      margin-top: 5px;
      color: #888;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing Advanced Galaxy Simulation</div>
    <div class="loading-subtext">
      Loading multi-threaded physics engine, advanced batching system, and GPU optimizations...
    </div>
  </div>

  <!-- Mode selection overlay -->
  <div id="mode-selection" style="display: none;">
    <div class="mode-container">
      <h1 class="mode-title">🌌 Galaxy Simulation Mode</h1>
      
      <button class="mode-button" onclick="startSimulation('performance')">
        ⚡ Performance Mode
        <div class="mode-description">50K-250K particles • Optimized for smooth 60 FPS • All devices</div>
      </button>
      
      <button class="mode-button" onclick="startSimulation('quality')">
        🎨 Quality Mode  
        <div class="mode-description">250K-500K particles • Enhanced visuals • Mid-range to high-end devices</div>
      </button>
      
      <button class="mode-button" onclick="startSimulation('extreme')">
        🚀 Extreme Mode
        <div class="mode-description">500K-1M particles • Maximum fidelity • High-end GPUs only</div>
      </button>
      
      <button class="mode-button" onclick="startSimulation('auto')">
        🤖 Auto-Detect Mode
        <div class="mode-description">Automatically configure based on your device capabilities</div>
      </button>
    </div>
  </div>

  <script>
    // Global simulation instance
    let galaxySimulation = null;
    
    // Show mode selection after initial loading
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('mode-selection').style.display = 'flex';
    }, 2000);
    
    async function startSimulation(mode) {
      // Hide mode selection
      document.getElementById('mode-selection').style.display = 'none';
      
      // Show loading screen
      document.getElementById('loading-screen').style.display = 'flex';
      document.querySelector('.loading-text').textContent = 'Starting ' + mode + ' mode...';
      
      try {
        // Import and initialize the optimized simulation
        const { OptimizedGalaxySimulation } = await import('./optimized-galaxy-demo.js');
        
        // Configure based on selected mode
        const config = getConfigForMode(mode);
        
        // Create simulation instance
        galaxySimulation = new OptimizedGalaxySimulation(config);
        
        // Hide loading screen once simulation is ready
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
        }, 1000);
        
      } catch (error) {
        console.error('Failed to start simulation:', error);
        document.querySelector('.loading-text').textContent = 'Error loading simulation';
        document.querySelector('.loading-subtext').textContent = error.message;
      }
    }
    
    function getConfigForMode(mode) {
      const baseConfig = {
        enableWorkers: true,
        enableBatching: true,
        adaptiveQuality: true,
        enableProfiling: true,
        targetFPS: 60
      };
      
      switch (mode) {
        case 'performance':
          return {
            ...baseConfig,
            particleCount: 50000,
            batchSize: 15000,
            maxDrawCalls: 16,
            physicsWorkers: 2
          };
          
        case 'quality':
          return {
            ...baseConfig,
            particleCount: 250000,
            batchSize: 30000,
            maxDrawCalls: 32,
            physicsWorkers: 4
          };
          
        case 'extreme':
          return {
            ...baseConfig,
            particleCount: 750000,
            batchSize: 50000,
            maxDrawCalls: 64,
            physicsWorkers: 6
          };
          
        case 'auto':
        default:
          return baseConfig; // Let the system auto-detect
      }
    }
    
    // Handle page cleanup
    window.addEventListener('beforeunload', () => {
      if (galaxySimulation) {
        galaxySimulation.dispose();
      }
    });
    
    // Error handling
    window.addEventListener('error', (event) => {
      console.error('Global error:', event.error);
      if (document.getElementById('loading-screen').style.display !== 'none') {
        document.querySelector('.loading-text').textContent = 'Error: ' + event.error.message;
      }
    });
  </script>
</body>
</html>
